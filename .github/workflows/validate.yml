name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Download and hash-check public data
        run: python src/download_data.py
      - name: Validate source syntax
        run: python -m compileall -q src tests
      - name: Run unit and real HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Reconcile stored experiment results
        run: python src/verify_results.py
